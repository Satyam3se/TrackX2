# ============================================================================
# TrackX — Docker orchestration
#
#   db         PostGIS 15 / Postgres 15
#   redis      Redis 7 (Celery broker + Channels channel layer)
#   web        Django ASGI (Daphne) REST + WebSocket API
#   celery     Celery worker (ANPR pipeline)
#   frontend   Nginx serving the React SPA and proxying API/WS to `web`
# ============================================================================

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: trackx-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: trackx_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: trackx_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trackx_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: trackx-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trackx-web
    restart: unless-stopped
    entrypoint: ["/entrypoint.sh"]
    environment:
      POSTGRES_DB: trackx_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: trackx_pass
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
      DJANGO_DEBUG: "0"
      MEDIA_ROOT: /app/media
      EASYOCR_MODULE_PATH: /app/easyocr_models
      GDAL_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu/libgdal.so
      GEOS_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu/libgeos_c.so
      YOLO_WEIGHTS: /app/license_plate_detector.pt
    volumes:
      - trackx_media:/app/media
      - trackx_models:/app/easyocr_models
      - ./license_plate_detector.pt:/app/license_plate_detector.pt
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trackx-celery
    restart: unless-stopped
    command: celery -A trackx worker -l info --concurrency=2
    environment:
      POSTGRES_DB: trackx_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: trackx_pass
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
      DJANGO_DEBUG: "0"
      MEDIA_ROOT: /app/media
      EASYOCR_MODULE_PATH: /app/easyocr_models
      GDAL_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu/libgdal.so
      GEOS_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu/libgeos_c.so
      YOLO_WEIGHTS: /app/license_plate_detector.pt
    volumes:
      - trackx_media:/app/media
      - trackx_models:/app/easyocr_models
      - ./license_plate_detector.pt:/app/license_plate_detector.pt
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_WS_URL: /ws/alerts/
    container_name: trackx-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - trackx_media:/media
    depends_on:
      - web

volumes:
  postgres_data:
  trackx_media:
  trackx_models:
